<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetQubo - Best Anime Source</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-body: #020209;
            --bg-nav: #0f0f0f;
            --bg-card: #141721;
            --bg-section-head: #1a1e2b;
            --border: #232838;
            --primary: #6c5ce7;
            --accent: #a55eea;
            --text-main: #f1f2f6;
            --text-sub: #c5c5c5;
            --font-main: 'Plus Jakarta Sans', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-main);
            background: var(--bg-body);
            color: var(--text-main);
            line-height: 1.5;
            padding-bottom: 70px; /* Spacing for bottom navbar on mobile */
        }

        .container { max-width: 1000px; margin: 0 auto; padding: 0 12px; }

        /* Top Header Navigation */
        header {
            background: var(--bg-nav);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            position: sticky; top: 0; z-index: 100;
        }

        .header-content { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }

        .logo-box {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff; font-weight: 800; font-size: 16px; padding: 6px 12px; border-radius: 8px;
        }

        .logo-text { font-size: 20px; font-weight: 800; letter-spacing: 0.5px; }

        .search-container { position: relative; flex-grow: 1; max-width: 350px; }

        .search-input {
            width: 100%; padding: 10px 16px; border-radius: 20px;
            background: var(--bg-body); border: 1px solid var(--border);
            color: #fff; outline: none; font-size: 13px;
        }

        .search-dropdown {
            display: none; position: absolute; top: 46px; left: 0; right: 0;
            background: var(--bg-nav); border: 1px solid var(--border);
            border-radius: 10px; overflow: hidden; max-height: 350px;
            overflow-y: auto; z-index: 200; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .search-item {
            display: flex; gap: 10px; padding: 10px 12px;
            border-bottom: 1px solid var(--border); cursor: pointer; align-items: center;
        }

        .search-item:hover { background: var(--bg-card); }
        .search-thumb { width: 40px; height: 55px; border-radius: 4px; object-fit: cover; }
        .search-name { font-size: 13px; font-weight: 700; color: var(--text-main); }
        .search-meta { font-size: 11px; color: var(--text-sub); }

        /* Anime Cards & Layout Section */
        .section-bar {
            background: var(--bg-section-head); border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border); padding: 10px 16px;
            display: flex; justify-content: space-between; align-items: center; margin-top: 16px;
            border-radius: 6px;
        }

        .section-title { font-size: 14px; font-weight: 700; text-transform: uppercase; color: var(--text-main); }
        .btn-more { 
            background: var(--primary); color: #fff; padding: 4px 12px; 
            border-radius: 6px; font-size: 12px; font-weight: 700; 
            border: none; cursor: pointer; transition: 0.2s;
        }
        .btn-more:hover { background: var(--accent); }

        /* Anime World Style Grid */
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .anime-card {
            background: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            position: relative;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .anime-card:hover { transform: translateY(-4px); }

        .card-thumb-wrap { position: relative; width: 100%; height: 180px; }
        .card-thumb { width: 100%; height: 100%; object-fit: cover; }

        /* AWI Style Quality Overlay Badge */
        .post-ql {
            position: absolute; top: 6px; left: 6px;
            z-index: 2;
        }
        .Qlty {
            background-color: rgba(0, 0, 0, 0.75);
            color: #fff; font-size: 10px; font-weight: 700;
            padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2);
            text-transform: uppercase;
        }

        .card-details { padding: 8px; }
        .card-title { font-size: 12px; font-weight: 700; line-height: 1.3; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-sub { font-size: 10px; color: var(--text-sub); margin-top: 4px; }

        /* Anime World India Style Mobile Bottom Navigation Bar */
        #mainMenu {
            display: block;
        }

        ul.ulbotoes {
            margin: 0;
            z-index: 100;
            box-sizing: border-box;
            list-style-type: none;
            padding: 8px 0;
            position: fixed;
            text-align: center;
            background: #020209;
            border-top: 1px solid var(--border);
            width: 100%;
            bottom: 0; right: 0;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        li.li {
            display: inline-block;
            text-align: center;
            flex: 1;
        }

        a.botao {
            text-decoration: none !important;
            color: var(--text-sub);
            font-family: var(--font-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            transition: color 0.3s ease;
        }

        a.botao i { font-size: 18px; }

        .textomenu {
            font-weight: 600;
            font-size: 9px;
            text-transform: uppercase;
        }

        a.botao.active {
            color: var(--primary);
            position: relative;
        }

        a.botao.active::after {
            content: '';
            position: absolute;
            bottom: -8px;
            width: 20px;
            height: 3px;
            background-color: var(--primary);
            border-radius: 2px;
        }

        /* Floating Action Button (FAB) */
        .li-fab {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 101;
        }

        a.botao-fab {
            border-radius: 50%;
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 20px;
            box-shadow: 0px 4px 12px rgba(108, 92, 231, 0.5);
            text-decoration: none;
        }

        /* Hide Mobile Bar on PC Screens */
        @media (min-width: 768px) {
            #mainMenu, .li-fab { display: none !important; }
            body { padding-bottom: 20px; }
            .anime-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
            .card-thumb-wrap { height: 220px; }
        }

        /* Modal Styles */
        .modal {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.85);
            z-index: 1000; overflow-y: auto; padding: 20px; backdrop-filter: blur(8px);
        }

        .modal-content {
            background: var(--bg-nav); max-width: 550px; margin: 30px auto;
            border-radius: 12px; border: 1px solid var(--border); padding: 20px; position: relative;
        }

        .close-btn { position: absolute; top: 15px; right: 15px; font-size: 22px; color: var(--text-sub); cursor: pointer; border: none; background: none; }
        .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
        .modal-img { width: 100%; height: 250px; object-fit: cover; border-radius: 8px; margin: 12px 0; }
        .modal-desc { font-size: 13px; color: var(--text-sub); line-height: 1.6; }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="container header-content">
            <div class="brand" onclick="location.reload()">
                <div class="logo-box">NQ</div>
                <div class="logo-text">NetQubo</div>
            </div>
            <div class="search-container">
                <input type="text" class="search-input" id="searchInput" placeholder="Search Anime (e.g. Solo Leveling)..." oninput="liveSearch()">
                <div class="search-dropdown" id="searchDropdown"></div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <div class="container">
        
        <!-- Trending Anime Section -->
        <div class="section-bar">
            <span class="section-title"><i class="fa-solid fa-fire" style="color: #ff7675; margin-right: 6px;"></i> Trending Anime</span>
            <button class="btn-more" onclick="openMoreModal('trending')">More ></button>
        </div>

        <div class="anime-grid" id="animeContainer">
            <!-- Dynamic Content Injected Here -->
        </div>

    </div>

    <!-- Floating Action Button (FAB) -->
    <div class="li-fab">
        <a href="#" class="botao-fab" onclick="openRandomAnime(); return false;">
            <i class="fa-solid fa-shuffle"></i>
        </a>
    </div>

    <!-- Anime World India Style Bottom Navigation Menu -->
    <div id="mainMenu">
        <ul class="ulbotoes">
            <li class="li">
                <a href="#" class="botao active">
                    <i class="fa-solid fa-house"></i>
                    <span class="textomenu">Home</span>
                </a>
            </li>
            <li class="li">
                <a href="#" class="botao" onclick="openMoreModal('trending'); return false;">
                    <i class="fa-solid fa-bolt"></i>
                    <span class="textomenu">Popular</span>
                </a>
            </li>
            <li class="li">
                <!-- Empty Space for FAB button in middle -->
            </li>
            <li class="li">
                <a href="#" class="botao" onclick="alert('Bookmarks feature coming soon!'); return false;">
                    <i class="fa-solid fa-bookmark"></i>
                    <span class="textomenu">Saved</span>
                </a>
            </li>
            <li class="li">
                <a href="#" class="botao" onclick="alert('Settings menu'); return false;">
                    <i class="fa-solid fa-gear"></i>
                    <span class="textomenu">Settings</span>
                </a>
            </li>
        </ul>
    </div>

    <!-- Multi-purpose In-App Modal -->
    <div id="infoModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h2 id="mTitle" class="modal-title">Details</h2>
            <div id="mBody"></div>
        </div>
    </div>

    <script>
        let searchTimer;
        let globalAnimeList = [];

        document.addEventListener('DOMContentLoaded', fetchTrendingAnime);

        // Fetch Top Trending Anime
        function fetchTrendingAnime() {
            const container = document.getElementById('animeContainer');
            fetch('https://api.jikan.moe/v4/top/anime?limit=12')
                .then(res => res.json())
                .then(data => {
                    globalAnimeList = data.data || [];
                    renderAnimeGrid(globalAnimeList);
                })
                .catch(() => {
                    container.innerHTML = `<p style="padding: 20px; text-align: center; color: var(--text-sub);">Failed to load anime list.</p>`;
                });
        }

        function renderAnimeGrid(items) {
            const container = document.getElementById('animeContainer');
            container.innerHTML = '';

            items.forEach(anime => {
                const card = document.createElement('div');
                card.className = 'anime-card';
                card.onclick = () => openDetails(anime.title, anime.images.jpg.large_image_url, anime.synopsis || 'No description available.');
                
                card.innerHTML = `
                    <div class="card-thumb-wrap">
                        <div class="post-ql"><span class="Qlty">HD • SUB/DUB</span></div>
                        <img src="${anime.images.jpg.image_url}" class="card-thumb" alt="${anime.title}">
                    </div>
                    <div class="card-details">
                        <div class="card-title">${anime.title}</div>
                        <div class="card-sub">Score: ${anime.score || 'N/A'} • ${anime.type || 'TV'}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Live Search Handler
        function liveSearch() {
            clearTimeout(searchTimer);
            const query = document.getElementById('searchInput').value.trim();
            const dropdown = document.getElementById('searchDropdown');

            if (query.length < 3) {
                dropdown.style.display = 'none';
                return;
            }

            searchTimer = setTimeout(() => {
                fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(query)}&limit=5`)
                    .then(res => res.json())
                    .then(data => {
                        dropdown.innerHTML = '';
                        if (!data.data || data.data.length === 0) {
                            dropdown.innerHTML = `<div class="search-item"><div class="search-name">No results found</div></div>`;
                        } else {
                            data.data.forEach(anime => {
                                const item = document.createElement('div');
                                item.className = 'search-item';
                                item.onclick = () => openDetails(anime.title, anime.images.jpg.large_image_url, anime.synopsis || 'No description available.');
                                item.innerHTML = `
                                    <img src="${anime.images.jpg.image_url}" class="search-thumb">
                                    <div>
                                        <div class="search-name">${anime.title}</div>
                                        <div class="search-meta">${anime.type || 'Anime'} • Score: ${anime.score || 'N/A'}</div>
                                    </div>
                                `;
                                dropdown.appendChild(item);
                            });
                        }
                        dropdown.style.display = 'block';
                    })
                    .catch(() => {
                        dropdown.innerHTML = `<div class="search-item"><div class="search-name">Error fetching data</div></div>`;
                        dropdown.style.display = 'block';
                    });
            }, 300);
        }

        // In-App Modal Functions
        function openDetails(title, img, desc) {
            document.getElementById('mTitle').innerText = title;
            let content = '';
            if (img) content += `<img src="${img}" class="modal-img">`;
            content += `<div class="modal-desc">${desc}</div>`;
            document.getElementById('mBody').innerHTML = content;
            document.getElementById('infoModal').style.display = 'block';
            document.getElementById('searchDropdown').style.display = 'none';
        }

        function openMoreModal(type) {
            if (type === 'trending') {
                document.getElementById('mTitle').innerText = "All Trending Anime";
                let content = '<div class="anime-grid">';
                globalAnimeList.forEach(anime => {
                    content += `
                        <div class="anime-card" onclick="openDetails('${anime.title.replace(/'/g, "\\'")}', '${anime.images.jpg.large_image_url}', '${(anime.synopsis || '').replace(/'/g, "\\'")}')">
                            <div class="card-thumb-wrap">
                                <div class="post-ql"><span class="Qlty">HD</span></div>
                                <img src="${anime.images.jpg.image_url}" class="card-thumb">
                            </div>
                            <div class="card-details">
                                <div class="card-title">${anime.title}</div>
                            </div>
                        </div>
                    `;
                });
                content += '</div>';
                document.getElementById('mBody').innerHTML = content;
            }
            document.getElementById('infoModal').style.display = 'block';
        }

        function openRandomAnime() {
            if (globalAnimeList.length > 0) {
                const random = globalAnimeList[Math.floor(Math.random() * globalAnimeList.length)];
                openDetails(random.title, random.images.jpg.large_image_url, random.synopsis);
            }
        }

        function closeModal() {
            document.getElementById('infoModal').style.display = 'none';
        }
    </script>
</body>
</html>
