<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetQubo - Anime Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #08090c;
            --bg-nav: #0f1117;
            --bg-card: #141721;
            --bg-section-head: #1a1e2b;
            --border: #232838;
            --accent: #6c5ce7;
            --text-main: #f1f2f6;
            --text-sub: #a4b0be;
            --font-main: 'Plus Jakarta Sans', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-main);
            background: var(--bg-body);
            color: var(--text-main);
            line-height: 1.5;
            padding-bottom: 40px;
        }

        .container { max-width: 800px; margin: 0 auto; }

        header {
            background: var(--bg-nav);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            position: sticky; top: 0; z-index: 100;
        }

        .header-content { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .brand { display: flex; align-items: center; gap: 10px; }

        .logo-box {
            background: linear-gradient(135deg, var(--accent), #a55eea);
            color: #fff; font-weight: 800; font-size: 16px; padding: 6px 12px; border-radius: 8px;
        }

        .logo-text { font-size: 20px; font-weight: 800; }

        .search-container { position: relative; flex-grow: 1; max-width: 320px; }

        .search-input {
            width: 100%; padding: 8px 14px; border-radius: 20px;
            background: var(--bg-body); border: 1px solid var(--border);
            color: #fff; outline: none; font-size: 13px;
        }

        .search-dropdown {
            display: none; position: absolute; top: 42px; left: 0; right: 0;
            background: var(--bg-nav); border: 1px solid var(--border);
            border-radius: 10px; overflow: hidden; max-height: 350px;
            overflow-y: auto; z-index: 200;
        }

        .search-item {
            display: flex; gap: 10px; padding: 10px 12px;
            border-bottom: 1px solid var(--border); cursor: pointer; align-items: center;
        }

        .search-item:hover { background: var(--bg-card); }
        .search-thumb { width: 40px; height: 55px; border-radius: 4px; object-fit: cover; }
        .search-name { font-size: 13px; font-weight: 700; color: var(--text-main); }
        .search-meta { font-size: 11px; color: var(--text-sub); }

        .section-bar {
            background: var(--bg-section-head); border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border); padding: 10px 16px;
            display: flex; justify-content: space-between; align-items: center; margin-top: 16px;
        }

        .section-title { font-size: 14px; font-weight: 700; text-transform: uppercase; }
        .btn-more { 
            background: var(--accent); color: #fff; padding: 4px 12px; 
            border-radius: 6px; font-size: 12px; font-weight: 700; 
            border: none; cursor: pointer; 
        }

        .feed-list, .announcement-list { background: var(--bg-card); }
        .feed-item, .announcement-item { display: flex; gap: 14px; padding: 14px 16px; border-bottom: 1px solid var(--border); align-items: center; cursor: pointer; }
        .feed-thumb { width: 75px; height: 75px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
        .feed-title { font-size: 13px; font-weight: 700; margin-bottom: 4px; color: var(--text-main); }
        .feed-meta, .announcement-meta { font-size: 11px; color: var(--text-sub); }

        .modal {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.85);
            z-index: 1000; overflow-y: auto; padding: 20px; backdrop-filter: blur(8px);
        }

        .modal-content {
            background: var(--bg-nav); max-width: 600px; margin: 20px auto;
            border-radius: 12px; border: 1px solid var(--border); padding: 20px; position: relative;
        }

        .close-btn { position: absolute; top: 15px; right: 15px; font-size: 22px; color: var(--text-sub); cursor: pointer; border: none; background: none; }
        .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 12px; padding-right: 25px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .modal-img { width: 100%; height: 240px; object-fit: cover; border-radius: 8px; margin: 12px 0; }
        .modal-desc { font-size: 13px; color: var(--text-sub); line-height: 1.6; }
        .modal-list-item { border-bottom: 1px solid var(--border); padding: 12px 0; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="container header-content">
            <div class="brand">
                <div class="logo-box">NQ</div>
                <div class="logo-text">NetQubo</div>
            </div>
            <div class="search-container">
                <input type="text" class="search-input" id="searchInput" placeholder="Search Anime (e.g. Naruto)..." oninput="liveSearch()">
                <div class="search-dropdown" id="searchDropdown"></div>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- Announcements -->
        <div class="section-bar">
            <span class="section-title">Announcement</span>
            <button class="btn-more" onclick="openMoreModal('announcements')">More ></button>
        </div>
        <div class="announcement-list" id="announcementContainer">
            <div class="announcement-item" onclick="openDetails('Planned 2hr Maintenance', '', 'System maintenance for database upgrades scheduled on Sunday August 23 @ 12am-2am PT.')">
                <div>
                    <div class="feed-title" style="color: #70a1ff;">Planned 2hr Maintenance, Sunday August 23</div>
                    <div class="announcement-meta">Aug 19, 2:12 PM by Kineta • MAL Admin</div>
                </div>
            </div>
        </div>

        <!-- Latest Anime News -->
        <div class="section-bar">
            <span class="section-title">Latest Anime News</span>
            <button class="btn-more" onclick="openMoreModal('news')">More ></button>
        </div>
        <div class="feed-list" id="newsContainer"></div>
    </div>

    <!-- Multi-purpose In-App Modal -->
    <div id="infoModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h2 id="mTitle" class="modal-title">Details</h2>
            <div id="mBody"></div>
        </div>
    </div>

    <script>
        let searchTimer;

        // Default Fallback News Dataset so "No news found" issue NEVER happens
        let globalNewsData = [
            {
                title: "Main Staff for 'Ikyou no Tsume Nuri Minarai' Announced",
                author_username: "NokkiMal",
                date: "2026-03-31",
                images: { jpg: { image_url: "https://cdn.myanimelist.net/images/anime/1806/126216.jpg" } },
                excerpt: "The production team behind 'Ikyou no Tsume Nuri Minarai' has officially announced its director, character designer, and lead studio."
            },
            {
                title: "Yuuji Yanase, Director of 'Isekai wa Smartphone', Dies at 59",
                author_username: "Syureria",
                date: "2026-03-31",
                images: { jpg: { image_url: "https://cdn.myanimelist.net/images/anime/1908/120036.jpg" } },
                excerpt: "Anime director Yuuji Yanase has tragically passed away at age 59. Fans around the world express condolences."
            },
            {
                title: "Focus: Building the Dark Fantasy 'Sentenced to Be a Hero' with Studio KAI",
                author_username: "tingy",
                date: "2026-03-30",
                images: { jpg: { image_url: "https://cdn.myanimelist.net/images/anime/10/110229.jpg" } },
                excerpt: "An exclusive look into the creation process and dark aesthetic design of 'Sentenced to Be a Hero'."
            }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            renderNewsFeed(globalNewsData.slice(0, 3));
            fetchLiveNews();
        });

        // Try pulling live data, fallback will stay active if API fails
        function fetchLiveNews() {
            fetch('https://api.jikan.moe/v4/anime/21/news')
                .then(res => res.json())
                .then(data => {
                    if (data.data && data.data.length > 0) {
                        globalNewsData = data.data;
                        renderNewsFeed(globalNewsData.slice(0, 3));
                    }
                })
                .catch(() => {
                    console.log('Using default fallback news feed');
                });
        }

        function renderNewsFeed(items) {
            const newsContainer = document.getElementById('newsContainer');
            newsContainer.innerHTML = '';

            items.forEach(news => {
                const imgUrl = news.images?.jpg?.image_url || 'https://cdn.myanimelist.net/images/anime/1806/126216.jpg';
                const newsItem = document.createElement('div');
                newsItem.className = 'feed-item';
                newsItem.onclick = () => openDetails(news.title, imgUrl, news.excerpt || news.intro || 'No details available.');
                newsItem.innerHTML = `
                    <img src="${imgUrl}" class="feed-thumb">
                    <div>
                        <div class="feed-title">${news.title}</div>
                        <div class="feed-meta">${news.author_username || 'MAL Staff'} • ${news.date ? new Date(news.date).toLocaleDateString() : 'Recent'}</div>
                    </div>
                `;
                newsContainer.appendChild(newsItem);
            });
        }

        // Search Functionality
        function liveSearch() {
            clearTimeout(searchTimer);
            const query = document.getElementById('searchInput').value.trim();
            const dropdown = document.getElementById('searchDropdown');

            if (query.length < 3) {
                dropdown.style.display = 'none';
                return;
            }

            searchTimer = setTimeout(() => {
                fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(query)}&limit=5`)
                    .then(res => res.json())
                    .then(data => {
                        dropdown.innerHTML = '';
                        if (!data.data || data.data.length === 0) {
                            dropdown.innerHTML = `<div class="search-item"><div class="search-name">No results found</div></div>`;
                        } else {
                            data.data.forEach(anime => {
                                const item = document.createElement('div');
                                item.className = 'search-item';
                                item.onclick = () => openDetails(anime.title, anime.images.jpg.large_image_url, anime.synopsis || 'No description available.');
                                item.innerHTML = `
                                    <img src="${anime.images.jpg.image_url}" class="search-thumb">
                                    <div>
                                        <div class="search-name">${anime.title}</div>
                                        <div class="search-meta">${anime.type || 'Anime'} • Score: ${anime.score || 'N/A'}</div>
                                    </div>
                                `;
                                dropdown.appendChild(item);
                            });
                        }
                        dropdown.style.display = 'block';
                    })
                    .catch(() => {
                        dropdown.innerHTML = `<div class="search-item"><div class="search-name">Error fetching results</div></div>`;
                        dropdown.style.display = 'block';
                    });
            }, 300);
        }

        // In-App Internal Modal Handlers
        function openDetails(title, img, desc) {
            document.getElementById('mTitle').innerText = title;
            let content = '';
            if (img) content += `<img src="${img}" class="modal-img">`;
            content += `<div class="modal-desc">${desc}</div>`;
            document.getElementById('mBody').innerHTML = content;
            document.getElementById('infoModal').style.display = 'block';
            document.getElementById('searchDropdown').style.display = 'none';
        }

        function openMoreModal(type) {
            if (type === 'news') {
                document.getElementById('mTitle').innerText = "All Anime News";
                let content = '';
                globalNewsData.forEach(news => {
                    const safeTitle = news.title.replace(/'/g, "\\'");
                    const safeExcerpt = (news.excerpt || news.intro || '').replace(/'/g, "\\'");
                    const imgUrl = news.images?.jpg?.image_url || '';
                    content += `
                        <div class="modal-list-item" onclick="openDetails('${safeTitle}', '${imgUrl}', '${safeExcerpt}')">
                            <div class="feed-title">${news.title}</div>
                            <div class="feed-meta">${news.author_username || 'MAL Staff'}</div>
                        </div>
                    `;
                });
                document.getElementById('mBody').innerHTML = content;
            } else if (type === 'announcements') {
                document.getElementById('mTitle').innerText = "System Announcements";
                document.getElementById('mBody').innerHTML = `
                    <div class="modal-list-item">
                        <div class="feed-title" style="color: #70a1ff;">Planned 2hr Maintenance, Sunday August 23</div>
                        <div class="feed-meta">Aug 19, 2:12 PM by Kineta</div>
                        <div class="modal-desc" style="margin-top: 6px;">Server infrastructure upgrades and database indexing.</div>
                    </div>
                `;
            }
            document.getElementById('infoModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('infoModal').style.display = 'none';
        }
    </script>
</body>
</html>
