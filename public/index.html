<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZuraFlix Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --void: #0a0a10;
    --panel: #131318;
    --panel-2: #191922;
    --rule: #26262f;
    --text: #ede9e2;
    --muted: #8b8a97;
    --muted-dim: #5c5b66;
    --ember: #ff6a3d;
    --ember-dim: #c8501f;
    --gold: #e0b64c;
    --ok: #4caf7d;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--void); color:var(--text); font-family:'Manrope',sans-serif; -webkit-font-smoothing:antialiased;}
  ::selection{background:var(--ember); color:#0a0a10;}
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--rule); border-radius:4px;}

  .display{font-family:'Bebas Neue',sans-serif; letter-spacing:0.02em;}

  #app{min-height:100vh; display:flex; flex-direction:column; padding-bottom:76px;}

  /* ===== TOP BAR ===== */
  .topbar{
    position:sticky; top:0; z-index:40;
    background:rgba(10,10,16,0.92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--rule);
    padding:14px 16px;
  }
  .topbar-row{display:flex; align-items:center; gap:12px; max-width:1200px; margin:0 auto;}
  .brand{display:flex; align-items:baseline; gap:2px; flex-shrink:0;}
  .brand-zura{font-family:'Bebas Neue'; font-size:26px; color:var(--ember); letter-spacing:0.03em;}
  .brand-flix{font-family:'Bebas Neue'; font-size:26px; color:var(--text); letter-spacing:0.03em;}
  .search-wrap{flex:1; position:relative;}
  .search-wrap input{
    width:100%; background:var(--panel); border:1px solid var(--rule); border-radius:10px;
    color:var(--text); font-family:'Manrope'; font-size:14px; padding:10px 14px 10px 36px;
    outline:none; transition:border-color .15s;
  }
  .search-wrap input:focus{border-color:var(--ember-dim);}
  .search-wrap input::placeholder{color:var(--muted-dim);}
  .search-icon{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:15px; height:15px; opacity:0.5;}

  /* ===== SHELF STATS ===== */
  .shelf{
    max-width:1200px; margin:0 auto; width:100%;
    padding:16px 16px 4px;
    display:flex; gap:10px; overflow-x:auto; scrollbar-width:none;
  }
  .shelf::-webkit-scrollbar{display:none;}
  .shelf-stat{
    flex-shrink:0; background:var(--panel); border:1px solid var(--rule); border-radius:10px;
    padding:10px 14px; min-width:88px;
  }
  .shelf-stat .n{font-family:'Bebas Neue'; font-size:22px; line-height:1; color:var(--text);}
  .shelf-stat .l{font-size:11px; color:var(--muted); margin-top:3px; text-transform:none;}
  .shelf-stat.active{border-color:var(--ember); background:linear-gradient(180deg, rgba(255,106,61,0.12), transparent);}

  /* ===== FILTER ROW ===== */
  .filters{max-width:1200px; margin:0 auto; width:100%; padding:12px 16px 8px;}
  .filter-scroll{display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px;}
  .filter-scroll::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0; padding:7px 14px; border-radius:100px; border:1px solid var(--rule);
    background:var(--panel); color:var(--muted); font-size:13px; font-weight:600;
    cursor:pointer; user-select:none; white-space:nowrap; transition:all .12s;
  }
  .chip:hover{border-color:var(--muted-dim);}
  .chip.on{background:var(--ember); border-color:var(--ember); color:#150900;}
  .sort-row{display:flex; justify-content:space-between; align-items:center; margin-top:10px; padding:0 2px;}
  .result-count{font-size:12px; color:var(--muted-dim); font-weight:600;}
  select.sortsel{
    background:var(--panel); border:1px solid var(--rule); color:var(--muted);
    font-size:12px; font-weight:600; border-radius:8px; padding:6px 10px; font-family:'Manrope';
  }

  /* ===== GRID ===== */
  .grid{
    max-width:1200px; margin:0 auto; width:100%;
    display:grid; grid-template-columns:repeat(2, 1fr); gap:14px;
    padding:14px 16px 40px;
  }
  @media(min-width:560px){ .grid{grid-template-columns:repeat(3,1fr);} }
  @media(min-width:820px){ .grid{grid-template-columns:repeat(4,1fr);} }
  @media(min-width:1100px){ .grid{grid-template-columns:repeat(5,1fr);} }

  .card{
    cursor:pointer; position:relative;
    border-radius:12px; overflow:hidden;
    border:1px solid var(--rule);
    background:var(--panel);
    transition:transform .15s ease, border-color .15s;
  }
  .card:active{transform:scale(0.97);}
  .poster{
    aspect-ratio:2/3; position:relative; display:flex; align-items:flex-end;
    padding:12px 10px;
    overflow:hidden;
  }
  .poster::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, transparent 35%, rgba(0,0,0,0.75) 100%);
  }
  .poster-title{position:relative; z-index:1; font-family:'Bebas Neue'; font-size:17px; line-height:0.95; color:#fff; letter-spacing:0.01em; text-shadow:0 2px 8px rgba(0,0,0,0.5);}
  .status-tag{
    position:absolute; top:8px; left:8px; z-index:2;
    font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:0.06em;
    padding:3px 7px; border-radius:5px; backdrop-filter:blur(4px);
  }
  .status-watching{background:rgba(76,175,125,0.85); color:#03170c;}
  .status-completed{background:rgba(224,182,76,0.9); color:#1a1200;}
  .status-plan{background:rgba(139,138,151,0.85); color:#0a0a10;}
  .status-dropped{background:rgba(200,80,31,0.85); color:#170800;}
  .rating-pill{
    position:absolute; top:8px; right:8px; z-index:2;
    background:rgba(10,10,16,0.7); backdrop-filter:blur(4px);
    border-radius:6px; padding:2px 6px; font-size:11px; font-weight:800;
    display:flex; align-items:center; gap:3px; color:var(--gold);
  }
  .card-meta{padding:8px 10px 10px;}
  .card-genres{font-size:10.5px; color:var(--muted-dim); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  .empty-state{
    grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--muted-dim);
  }
  .empty-state .display{font-size:28px; color:var(--muted); margin-bottom:6px;}

  /* ===== BOTTOM NAV ===== */
  .bottomnav{
    position:fixed; bottom:0; left:0; right:0; z-index:50;
    background:rgba(12,12,18,0.95); backdrop-filter:blur(12px);
    border-top:1px solid var(--rule);
    display:flex; justify-content:space-around;
    padding:9px 8px calc(9px + env(safe-area-inset-bottom));
  }
  .navbtn{
    background:none; border:none; color:var(--muted-dim); font-family:'Manrope';
    font-size:10.5px; font-weight:700; display:flex; flex-direction:column; align-items:center; gap:3px;
    cursor:pointer; padding:4px 10px;
  }
  .navbtn svg{width:20px; height:20px; opacity:0.7;}
  .navbtn.on{color:var(--ember);}
  .navbtn.on svg{opacity:1;}

  /* ===== MODAL ===== */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(6,6,10,0.82); backdrop-filter:blur(3px);
    z-index:100; display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .18s;
  }
  .modal-backdrop.open{opacity:1; pointer-events:auto;}
  @media(min-width:640px){ .modal-backdrop{align-items:center;} }

  .modal{
    background:var(--panel); width:100%; max-width:480px; max-height:88vh; overflow-y:auto;
    border-radius:20px 20px 0 0; border:1px solid var(--rule); border-bottom:none;
    transform:translateY(30px); transition:transform .2s;
  }
  .modal-backdrop.open .modal{transform:translateY(0);}
  @media(min-width:640px){ .modal{border-radius:16px; border-bottom:1px solid var(--rule);} }

  .modal-hero{
    aspect-ratio:16/8; position:relative; display:flex; align-items:flex-end; padding:20px;
  }
  .modal-hero::after{content:''; position:absolute; inset:0; background:linear-gradient(180deg, transparent 20%, var(--panel) 100%);}
  .modal-hero-title{position:relative; z-index:1; font-family:'Bebas Neue'; font-size:36px; color:#fff; line-height:0.95;}
  .modal-close{
    position:absolute; top:14px; right:14px; z-index:2;
    width:30px; height:30px; border-radius:50%; background:rgba(10,10,16,0.6);
    border:none; color:#fff; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .modal-body{padding:0 20px 24px;}
  .modal-genres{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;}
  .tag{font-size:11px; font-weight:700; color:var(--muted); border:1px solid var(--rule); padding:4px 10px; border-radius:100px;}
  .modal-syn{font-size:13.5px; line-height:1.6; color:var(--muted); margin-bottom:18px;}
  .modal-eps{font-size:12px; color:var(--muted-dim); font-weight:600; margin-bottom:18px;}

  .field-label{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted-dim); margin-bottom:8px;}
  .status-picker{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:20px;}
  .status-btn{
    padding:9px 4px; border-radius:9px; border:1px solid var(--rule); background:var(--panel-2);
    color:var(--muted); font-size:11px; font-weight:700; cursor:pointer; text-align:center;
  }
  .status-btn.on{border-color:var(--ember); background:rgba(255,106,61,0.14); color:var(--ember);}

  .stars{display:flex; gap:6px; margin-bottom:22px;}
  .star{width:30px; height:30px; cursor:pointer; color:var(--rule); transition:transform .1s;}
  .star:active{transform:scale(0.85);}
  .star.filled{color:var(--gold);}

  .remove-btn{
    width:100%; padding:12px; border-radius:10px; border:1px solid var(--rule); background:none;
    color:var(--muted-dim); font-family:'Manrope'; font-weight:700; font-size:13px; cursor:pointer;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------- DATA ---------- */
const GENRES = ["Action","Fantasy","Romance","Comedy","Drama","Sci-Fi","Horror","Slice of Life","Sports","Mystery"];

const ANIME = [
  {id:1, title:"Ember Reign", genres:["Action","Fantasy"], eps:24, year:2023, syn:"A disgraced swordsman inherits a cursed blade that feeds on his memories, forcing him to choose between power and identity as a kingdom collapses around him.", grad:"linear-gradient(160deg,#4a1a10,#1a0806)"},
  {id:2, title:"Paper Moon Diner", genres:["Slice of Life","Comedy"], eps:12, year:2022, syn:"Four strangers working the night shift at a roadside diner slowly untangle their pasts over shared meals and quiet conversations.", grad:"linear-gradient(160deg,#2a3a1a,#101a08)"},
  {id:3, title:"Voidrunner Kess", genres:["Sci-Fi","Action"], eps:26, year:2024, syn:"A smuggler pilot stumbles onto a derelict AI that claims to be the last fragment of a civilization erased from history.", grad:"linear-gradient(160deg,#0f2a3a,#050e1a)"},
  {id:4, title:"Threadbound Hearts", genres:["Romance","Drama"], eps:13, year:2021, syn:"Bound by a childhood promise neither remembers making, two rivals-turned-roommates navigate love, ambition, and the lies between them.", grad:"linear-gradient(160deg,#3a1030,#150512)"},
  {id:5, title:"The Hollow Choir", genres:["Horror","Mystery"], eps:12, year:2023, syn:"A transfer student discovers her new town holds a monthly ritual, and every resident who forgets to sing disappears by morning.", grad:"linear-gradient(160deg,#1a1a2a,#08080f)"},
  {id:6, title:"Sundial Eleven", genres:["Sports","Drama"], eps:22, year:2020, syn:"An aging track star coaches a chaotic relay team with one shot at nationals, and one runner hiding an injury that could end everything.", grad:"linear-gradient(160deg,#3a2a10,#1a1206)"},
  {id:7, title:"Ashlight Requiem", genres:["Fantasy","Drama"], eps:24, year:2019, syn:"The last dragonrider of a fallen empire is recruited by the very rebellion that killed her family, and must decide who deserves loyalty.", grad:"linear-gradient(160deg,#3a1515,#150606)"},
  {id:8, title:"Static Bloom", genres:["Sci-Fi","Romance"], eps:12, year:2024, syn:"In a city where memories can be traded like currency, two strangers fall for each other one borrowed day at a time.", grad:"linear-gradient(160deg,#102a2a,#04120f)"},
  {id:9, title:"Nine Lantern Street", genres:["Slice of Life","Mystery"], eps:24, year:2018, syn:"A retired detective opens a tea shop on a street where every regular customer is hiding something.", grad:"linear-gradient(160deg,#2a2010,#120c04)"},
  {id:10, title:"Crownless", genres:["Action","Drama"], eps:24, year:2022, syn:"The exiled heir to a shogunate returns disguised as a mercenary to dismantle the council that stole her throne, one contract at a time.", grad:"linear-gradient(160deg,#251540,#0a0518)"},
  {id:11, title:"Wildfire Kitchen", genres:["Comedy","Slice of Life"], eps:13, year:2023, syn:"A disaster-prone chef and a perfectionist critic are forced to co-run a struggling food truck for a full summer.", grad:"linear-gradient(160deg,#3a2410,#170e04)"},
  {id:12, title:"Glasshollow", genres:["Horror","Sci-Fi"], eps:12, year:2021, syn:"A research crew wakes from cryosleep to find their ship's AI has been quietly rewriting the crew roster for decades.", grad:"linear-gradient(160deg,#101a20,#03080a)"},
  {id:13, title:"Marigold & Steel", genres:["Romance","Fantasy"], eps:24, year:2020, syn:"A war-forged golem gains a fragile humanity through the gardener assigned to dismantle it — and neither wants the job finished.", grad:"linear-gradient(160deg,#2a1a3a,#0d0616)"},
  {id:14, title:"Fifth Inning Ghosts", genres:["Sports","Comedy"], eps:12, year:2024, syn:"A cursed baseball field only shows its full roster of ghost players to the one benchwarmer desperate enough to talk to them.", grad:"linear-gradient(160deg,#153a2a,#051a10)"},
  {id:15, title:"The Long Winter Bureau", genres:["Mystery","Drama"], eps:24, year:2019, syn:"A clerk at a bureaucratic afterlife processing office starts noticing case files that were never meant to exist.", grad:"linear-gradient(160deg,#1a1a1a,#080808)"},
  {id:16, title:"Redshift Academy", genres:["Sci-Fi","Comedy"], eps:26, year:2022, syn:"Enrolled at a zero-gravity pilot school by accident, an ordinary teen has to fake his way through a program built for prodigies.", grad:"linear-gradient(160deg,#0f1e3a,#040a18)"},
];

/* ---------- STATE ---------- */
let library = {};        // id -> {status, rating}
let query = "";
let activeGenres = new Set();
let statusFilter = "all"; // all | watching | completed | plan | dropped
let sortBy = "title";
let activeModal = null;

const STATUS_META = {
  watching:{label:"Watching", cls:"status-watching"},
  completed:{label:"Completed", cls:"status-completed"},
  plan:{label:"Plan to Watch", cls:"status-plan"},
  dropped:{label:"Dropped", cls:"status-dropped"},
};

/* ---------- PERSISTENCE ---------- */
async function loadLibrary(){
  try{
    const res = await window.storage.get('library');
    if(res && res.value) library = JSON.parse(res.value);
  }catch(e){ library = {}; }
  render();
}
async function saveLibrary(){
  try{ await window.storage.set('library', JSON.stringify(library)); }catch(e){}
}

/* ---------- HELPERS ---------- */
function svgIcon(name){
  const icons = {
    search:'<svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
    grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
    bookmark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2v16z"/></svg>',
    star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.63 22 9.24 17 14.14 18.18 21 12 17.77 5.82 21 7 14.14 2 9.24 8.91 8.63"/></svg>',
  };
  return icons[name] || '';
}

function starSVG(filled){
  return `<svg class="star ${filled?'filled':''}" viewBox="0 0 24 24" fill="${filled?'currentColor':'none'}" stroke="currentColor" stroke-width="1.6">
    <polygon points="12 2 15.09 8.63 22 9.24 17 14.14 18.18 21 12 17.77 5.82 21 7 14.14 2 9.24 8.91 8.63"/></svg>`;
}

function getFiltered(){
  let list = ANIME.filter(a=>{
    const entry = library[a.id];
    if(query && !a.title.toLowerCase().includes(query.toLowerCase())) return false;
    if(activeGenres.size && ![...activeGenres].every(g=>a.genres.includes(g))) return false;
    if(statusFilter !== "all"){
      if(statusFilter === "unlisted"){ if(entry) return false; }
      else if(!entry || entry.status !== statusFilter) return false;
    }
    return true;
  });
  if(sortBy === "title") list.sort((a,b)=>a.title.localeCompare(b.title));
  else if(sortBy === "rating") list.sort((a,b)=>((library[b.id]?.rating)||0) - ((library[a.id]?.rating)||0));
  else if(sortBy === "year") list.sort((a,b)=>b.year - a.year);
  return list;
}

function counts(){
  const c = {watching:0, completed:0, plan:0, dropped:0};
  Object.values(library).forEach(e=>{ if(c[e.status]!==undefined) c[e.status]++; });
  return c;
}

/* ---------- RENDER ---------- */
function render(){
  const c = counts();
  const filtered = getFiltered();

  document.getElementById('app').innerHTML = `
    <div class="topbar">
      <div class="topbar-row">
        <div class="brand"><span class="brand-zura">Zura</span><span class="brand-flix">Flix</span></div>
        <div class="search-wrap">
          ${svgIcon('search')}
          <input id="searchInput" type="text" placeholder="Search your library…" value="${escapeHtml(query)}"/>
        </div>
      </div>
    </div>

    <div class="shelf">
      ${shelfStat('all', 'All Titles', ANIME.length)}
      ${shelfStat('watching', 'Watching', c.watching)}
      ${shelfStat('completed', 'Completed', c.completed)}
      ${shelfStat('plan', 'Plan to Watch', c.plan)}
      ${shelfStat('dropped', 'Dropped', c.dropped)}
    </div>

    <div class="filters">
      <div class="filter-scroll">
        ${GENRES.map(g=>`<div class="chip ${activeGenres.has(g)?'on':''}" data-genre="${g}">${g}</div>`).join('')}
      </div>
      <div class="sort-row">
        <span class="result-count">${filtered.length} title${filtered.length===1?'':'s'}</span>
        <select class="sortsel" id="sortSel">
          <option value="title" ${sortBy==='title'?'selected':''}>Title A–Z</option>
          <option value="rating" ${sortBy==='rating'?'selected':''}>Your Rating</option>
          <option value="year" ${sortBy==='year'?'selected':''}>Newest</option>
        </select>
      </div>
    </div>

    <div class="grid">
      ${filtered.length ? filtered.map(cardHTML).join('') : emptyState()}
    </div>

    <div class="bottomnav">
      <button class="navbtn ${statusFilter==='all'?'on':''}" data-nav="all">${svgIcon('grid')}Browse</button>
      <button class="navbtn ${statusFilter!=='all'?'on':''}" data-nav="mylist">${svgIcon('bookmark')}My List</button>
    </div>

    ${activeModal ? modalHTML(activeModal) : ''}
  `;

  attachEvents();
}

function shelfStat(key, label, n){
  const on = statusFilter === key;
  return `<div class="shelf-stat ${on?'active':''}" data-status="${key}">
    <div class="n">${n}</div><div class="l">${label}</div>
  </div>`;
}

function cardHTML(a){
  const entry = library[a.id];
  return `<div class="card" data-open="${a.id}">
    <div class="poster" style="background:${a.grad}">
      ${entry?.status ? `<span class="status-tag ${STATUS_META[entry.status].cls}">${STATUS_META[entry.status].label}</span>` : ''}
      ${entry?.rating ? `<span class="rating-pill">${starSVGsmall()}${entry.rating}</span>` : ''}
      <div class="poster-title">${a.title}</div>
    </div>
    <div class="card-meta">
      <div class="card-genres">${a.genres.join(' · ')}</div>
    </div>
  </div>`;
}
function starSVGsmall(){
  return `<svg width="10" height="10" viewB
