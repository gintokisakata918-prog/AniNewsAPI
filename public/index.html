<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetQubo - MAL Integrated Anime Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #08090c;
            --bg-nav: #0f1117;
            --bg-card: #141721;
            --bg-section-head: #1a1e2b;
            --border: #232838;
            --accent: #6c5ce7;
            --accent-glow: rgba(108, 92, 231, 0.25);
            --text-main: #f1f2f6;
            --text-sub: #a4b0be;
            --text-muted: #57606f;
            --badge-orange: #ff9f43;
            --font-main: 'Plus Jakarta Sans', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-main);
            background: var(--bg-body);
            color: var(--text-main);
            line-height: 1.5;
            padding-bottom: 40px;
        }

        .container { max-width: 800px; margin: 0 auto; }

        /* Navigation Header */
        header {
            background: var(--bg-nav);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .brand { display: flex; align-items: center; gap: 10px; }

        .logo-box {
            background: linear-gradient(135deg, var(--accent), #a55eea);
            color: #fff; font-weight: 800; font-size: 16px;
            padding: 6px 12px; border-radius: 8px;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .logo-text { font-size: 20px; font-weight: 800; }

        /* Interactive MAL Search Box */
        .search-container {
            position: relative;
            flex-grow: 1;
            max-width: 320px;
        }

        .search-input {
            width: 100%;
            padding: 7px 14px;
            border-radius: 20px;
            background: var(--bg-body);
            border: 1px solid var(--border);
            color: #fff;
            outline: none;
            font-size: 13px;
        }

        .search-input:focus { border-color: var(--accent); }

        /* MAL Incremental Results Dropdown */
        .search-dropdown {
            display: none;
            position: absolute;
            top: 38px; left: 0; right: 0;
            background: var(--bg-nav);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            z-index: 200;
        }

        .search-item {
            display: flex; gap: 10px; padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            cursor: pointer; align-items: center;
        }

        .search-item:hover { background: var(--bg-card); }
        .search-thumb { width: 35px; height: 50px; border-radius: 4px; object-fit: cover; }
        .search-name { font-size: 13px; font-weight: 700; color: var(--text-main); }
        .search-meta { font-size: 11px; color: var(--text-sub); }

        /* Section Bars */
        .section-bar {
            background: var(--bg-section-head);
            border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
            padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; margin-top: 16px;
        }

        .section-title { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .btn-more {
            background: var(--accent); color: #fff; padding: 3px 10px;
            border-radius: 4px; font-size: 12px; font-weight: 700; text-decoration: none;
        }

        /* Feeds */
        .feed-list, .announcement-list { background: var(--bg-card); }

        .announcement-item { padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
        .announcement-title { font-size: 14px; font-weight: 700; color: #70a1ff; margin-bottom: 4px; }

        .feed-item {
            display: flex; gap: 14px; padding: 14px 16px;
            border-bottom: 1px solid var(--border); align-items: center; cursor: pointer;
        }

        .feed-thumb { width: 85px; height: 60px; border-radius: 8px; object-fit: cover; }
        .feed-title { font-size: 14px; font-weight: 700; line-height: 1.4; margin-bottom: 6px; }
        .feed-meta, .announcement-meta { font-size: 12px; color: var(--text-sub); }

        /* Modal Overlay */
        .modal {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.85);
            z-index: 1000; overflow-y: auto; padding: 20px; backdrop-filter: blur(8px);
        }

        .modal-content {
            background: var(--bg-nav); max-width: 550px; margin: 30px auto;
            border-radius: 12px; border: 1px solid var(--border); padding: 20px; position: relative;
        }

        .close-btn {
            position: absolute; top: 15px; right: 15px; font-size: 22px;
            color: var(--text-sub); cursor: pointer; border: none; background: none;
        }

        .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 6px; padding-right: 25px; }
        .modal-author { font-size: 12px; color: var(--text-sub); margin-bottom: 14px; }
        .modal-img { width: 100%; height: 240px; object-fit: cover; border-radius: 8px; margin-bottom: 14px; }
        .modal-desc { font-size: 13px; color: var(--text-sub); line-height: 1.6; margin-bottom: 16px; }
    </style>
</head>
<body>

    <header>
        <div class="container header-content">
            <div class="brand">
                <div class="logo-box">NQ</div>
                <div class="logo-text">NetQubo</div>
            </div>
            
            <!-- Real-time Dropdown Search -->
            <div class="search-container">
                <input type="text" class="search-input" id="searchInput" placeholder="Search Anime, Manga..." onkeyup="handleSearch()">
                <div class="search-dropdown" id="searchDropdown">
                    <div class="search-item" onclick="openDetails('Chainsaw Man', 'Tatsuki Fujimoto', 'https://cdn.myanimelist.net/images/anime/1806/126216.jpg', 'Action, Supernatural', 'Denji is a young man trapped in poverty, working off his deceased father\'s debt.')">
                        <img src="https://cdn.myanimelist.net/images/anime/1806/126216.jpg" class="search-thumb">
                        <div>
                            <div class="search-name">Chainsaw Man</div>
                            <div class="search-meta">TV • Score: 8.7</div>
                        </div>
                    </div>
                    <div class="search-item" onclick="openDetails('Bleach: TYBW', 'Tite Kubo', 'https://cdn.myanimelist.net/images/anime/1908/120036.jpg', 'Action, Adventure', 'The peace is suddenly broken when warning sirens chime through the Soul Society.')">
                        <img src="https://cdn.myanimelist.net/images/anime/1908/120036.jpg" class="search-thumb">
                        <div>
                            <div class="search-name">Bleach: TYBW</div>
                            <div class="search-meta">TV • Score: 9.1</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- MAL Announcement Feed -->
        <div class="section-bar">
            <span class="section-title">Announcement</span>
            <a href="#" class="btn-more">More ></a>
        </div>
        <div class="announcement-list">
            <div class="announcement-item" onclick="openDetails('Planned 2hr Maintenance', 'Kineta', 'https://cdn.myanimelist.net/images/anime/1806/126216.jpg', 'System', 'Planned maintenance for infrastructure optimization.')">
                <div class="announcement-title">Planned 2hr Maintenance, Sunday August 23 @ 12am-2am PT</div>
                <div class="announcement-meta">Aug 19, 2:12 PM by Kineta • 0 replies</div>
            </div>
        </div>

        <!-- MAL News Feed -->
        <div class="section-bar">
            <span class="section-title">Latest Anime News</span>
            <a href="#" class="btn-more">More ></a>
        </div>
        <div class="feed-list">
            <div class="feed-item" onclick="openDetails('Conqueror Is Secretly a Hero Back from Another World', 'Yoichi Sakaki', 'https://cdn.myanimelist.net/images/anime/1908/120036.jpg', 'Action, Fantasy', 'Rento Yuuki defeats the demon lord in another world and returns home safely.')">
                <img src="https://cdn.myanimelist.net/images/anime/1908/120036.jpg" class="feed-thumb">
                <div class="feed-content">
                    <div class="feed-title">Conqueror Is Secretly a Hero Back from Another World</div>
                    <div class="feed-meta"><span>Anime News Network</span> • <span>2 hours ago</span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Click Popup Modal -->
    <div id="infoModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeDetails()">&times;</button>
            <h2 id="mTitle" class="modal-title"></h2>
            <div id="mAuthor" class="modal-author"></div>
            <img id="mImg" class="modal-img" src="">
            <div id="mDesc" class="modal-desc"></div>
        </div>
    </div>

    <script>
        function handleSearch() {
            let input = document.getElementById('searchInput').value;
            let dropdown = document.getElementById('searchDropdown');
            if(input.length > 0) {
                dropdown.style.display = 'block';
            } else {
                dropdown.style.display = 'none';
            }
        }

        function openDetails(title, author, img, genres, desc) {
            document.getElementById('mTitle').innerText = title;
            document.getElementById('mAuthor').innerText = "Author/Publisher: " + author;
            document.getElementById('mImg').src = img;
            document.getElementById('mDesc').innerText = desc;
            document.getElementById('infoModal').style.display = 'block';
            document.getElementById('searchDropdown').style.display = 'none';
        }

        function closeDetails() {
            document.getElementById('infoModal').style.display = 'none';
        }
    </script>
</body>
</html>
