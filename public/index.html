<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetQubo - Watch Hindi, Tamil, Telugu Anime Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-body: #020209;
            --bg-nav: #0f0f0f;
            --bg-card: #141721;
            --bg-section-head: #1a1e2b;
            --border: #232838;
            --primary: #6c5ce7;
            --accent: #a55eea;
            --text-main: #f1f2f6;
            --text-sub: #c5c5c5;
            --font-main: 'Plus Jakarta Sans', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-main);
            background: var(--bg-body);
            color: var(--text-main);
            line-height: 1.5;
            padding-bottom: 75px;
        }

        .container { max-width: 1000px; margin: 0 auto; padding: 0 12px; }

        /* Header Navigation */
        header {
            background: var(--bg-nav);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            position: sticky; top: 0; z-index: 100;
        }

        .header-content { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }

        .logo-box {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff; font-weight: 800; font-size: 16px; padding: 6px 12px; border-radius: 8px;
        }

        .logo-text { font-size: 20px; font-weight: 800; }

        .search-container { position: relative; flex-grow: 1; max-width: 350px; }

        .search-input {
            width: 100%; padding: 10px 16px; border-radius: 20px;
            background: var(--bg-body); border: 1px solid var(--border);
            color: #fff; outline: none; font-size: 13px;
        }

        .search-dropdown {
            display: none; position: absolute; top: 46px; left: 0; right: 0;
            background: var(--bg-nav); border: 1px solid var(--border);
            border-radius: 10px; overflow: hidden; max-height: 350px;
            overflow-y: auto; z-index: 200; box-shadow: 0 8px 24px rgba(0,0,0,0.8);
        }

        .search-item {
            display: flex; gap: 10px; padding: 10px 12px;
            border-bottom: 1px solid var(--border); cursor: pointer; align-items: center;
        }

        .search-item:hover { background: var(--bg-card); }
        .search-thumb { width: 40px; height: 55px; border-radius: 4px; object-fit: cover; }
        .search-name { font-size: 13px; font-weight: 700; color: var(--text-main); }
        .search-meta { font-size: 11px; color: var(--text-sub); }

        /* Section Header */
        .section-bar {
            background: var(--bg-section-head); border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border); padding: 10px 16px;
            display: flex; justify-content: space-between; align-items: center; margin-top: 16px;
            border-radius: 6px;
        }

        .section-title { font-size: 14px; font-weight: 700; text-transform: uppercase; color: var(--text-main); }

        /* AWI Style Anime Streaming Cards Grid */
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        .anime-card {
            background: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            position: relative;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .anime-card:hover { transform: translateY(-4px); }

        .card-thumb-wrap { position: relative; width: 100%; height: 185px; }
        .card-thumb { width: 100%; height: 100%; object-fit: cover; }

        /* AWI Quality Badge Overlay */
        .post-ql { position: absolute; top: 6px; left: 6px; z-index: 2; }
        .Qlty {
            background-color: rgba(0, 0, 0, 0.8);
            color: #fff; font-size: 9px; font-weight: 700;
            padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2);
            text-transform: uppercase;
        }

        .ep-badge {
            position: absolute; bottom: 6px; right: 6px;
            background: var(--primary); color: #fff;
            font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 4px;
        }

        .card-details { padding: 8px; }
        .card-title { font-size: 12px; font-weight: 700; line-height: 1.3; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-sub { font-size: 10px; color: var(--text-sub); margin-top: 4px; }

        /* AWI Video Player Modal / Page Screen */
        .player-modal {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: #000;
            z-index: 1000; overflow-y: auto; padding-bottom: 80px;
        }

        .player-header {
            background: var(--bg-nav); padding: 14px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .video-container {
            width: 100%; max-width: 900px; margin: 0 auto;
            aspect-ratio: 16 / 9; background: #000;
        }

        iframe.video-player { width: 100%; height: 100%; border: none; }

        .stream-controls {
            padding: 16px; max-width: 900px; margin: 0 auto;
        }

        .server-btn-group {
            display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap;
        }

        .server-btn {
            background: var(--bg-card); color: var(--text-main);
            border: 1px solid var(--border); padding: 8px 14px;
            border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer;
        }

        .server-btn.active { background: var(--primary); border-color: var(--primary); }

        .episode-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 8px; margin-top: 12px;
        }

        .ep-btn {
            background: var(--bg-card); border: 1px solid var(--border);
            color: #fff; padding: 8px; border-radius: 6px;
            text-align: center; font-size: 12px; font-weight: 700; cursor: pointer;
        }

        .ep-btn.active { background: var(--accent); }

        /* Anime World India Bottom Menu */
        #mainMenu { display: block; }

        ul.ulbotoes {
            margin: 0; z-index: 100; box-sizing: border-box;
            list-style-type: none; padding: 8px 0; position: fixed;
            text-align: center; background: #020209; border-top: 1px solid var(--border);
            width: 100%; bottom: 0; right: 0; display: flex;
            justify-content: space-around; align-items: center;
        }

        li.li { display: inline-block; text-align: center; flex: 1; }

        a.botao {
            text-decoration: none !important; color: var(--text-sub);
            font-family: var(--font-main); display: flex; flex-direction: column;
            align-items: center; gap: 3px;
        }

        a.botao i { font-size: 18px; }
        .textomenu { font-weight: 600; font-size: 9px; text-transform: uppercase; }

        a.botao.active { color: var(--primary); position: relative; }
        a.botao.active::after {
            content: ''; position: absolute; bottom: -8px; width: 20px; height: 3px;
            background-color: var(--primary); border-radius: 2px;
        }

        /* FAB Button */
        .li-fab { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); z-index: 101; }
        a.botao-fab {
            border-radius: 50%; width: 48px; height: 48px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex; justify-content: center; align-items: center;
            color: #fff; font-size: 20px; box-shadow: 0px 4px 12px rgba(108, 92, 231, 0.5);
            text-decoration: none;
        }

        @media (min-width: 768px) {
            #mainMenu, .li-fab { display: none !important; }
            body { padding-bottom: 20px; }
            .anime-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
            .card-thumb-wrap { height: 230px; }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="container header-content">
            <div class="brand" onclick="location.reload()">
                <div class="logo-box">NQ</div>
                <div class="logo-text">NetQubo</div>
            </div>
            <div class="search-container">
                <input type="text" class="search-input" id="searchInput" placeholder="Search Anime or Cartoon..." oninput="liveSearch()">
                <div class="search-dropdown" id="searchDropdown"></div>
            </div>
        </div>
    </header>

    <div class="container">
        
        <!-- Stream Feed Sections -->
        <div class="section-bar">
            <span class="section-title"><i class="fa-solid fa-play" style="color: #ff7675; margin-right: 6px;"></i> Latest Anime Releases</span>
        </div>

        <div class="anime-grid" id="animeContainer">
            <!-- Dynamic Anime Streaming Cards -->
        </div>

    </div>

    <!-- AWI Fullscreen Streaming Player -->
    <div id="playerModal" class="player-modal">
        <div class="player-header">
            <h3 id="pTitle" style="font-size: 15px;">Watching Anime</h3>
            <button onclick="closePlayer()" style="background: none; border: none; color: #fff; font-size: 20px; cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="video-container">
            <iframe id="videoPlayer" class="video-player" src="" allowfullscreen></iframe>
        </div>

        <div class="stream-controls">
            <h2 id="pMainTitle" style="font-size: 18px; font-weight: 800;">Anime Title</h2>
            <p id="pMeta" style="font-size: 12px; color: var(--text-sub); margin-top: 4px;">Hindi Dubbed • Episode 1</p>

            <div style="margin-top: 16px;">
                <span style="font-size: 12px; font-weight: 700; color: var(--text-sub);">SELECT SERVER:</span>
                <div class="server-btn-group">
                    <button class="server-btn active"><i class="fa-solid fa-server"></i> Server 1 (HD)</button>
                    <button class="server-btn"><i class="fa-solid fa-server"></i> Server 2 (Fast)</button>
                </div>
            </div>

            <div style="margin-top: 16px;">
                <span style="font-size: 12px; font-weight: 700; color: var(--text-sub);">EPISODES:</span>
                <div class="episode-grid" id="episodesGrid">
                    <div class="ep-btn active">Ep 1</div>
                    <div class="ep-btn">Ep 2</div>
                    <div class="ep-btn">Ep 3</div>
                    <div class="ep-btn">Ep 4</div>
                    <div class="ep-btn">Ep 5</div>
                    <div class="ep-btn">Ep 6</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Floating Action Button -->
    <div class="li-fab">
        <a href="#" class="botao-fab" onclick="openRandomStream(); return false;">
            <i class="fa-solid fa-shuffle"></i>
        </a>
    </div>

    <!-- Anime World Mobile Bottom Menu Bar -->
    <div id="mainMenu">
        <ul class="ulbotoes">
            <li class="li">
                <a href="#" class="botao active">
                    <i class="fa-solid fa-house"></i>
                    <span class="textomenu">Home</span>
                </a>
            </li>
            <li class="li">
                <a href="#" class="botao" onclick="alert('Hindi Dubbed Anime Section'); return false;">
                    <i class="fa-solid fa-closed-captioning"></i>
                    <span class="textomenu">Hindi Dub</span>
                </a>
            </li>
            <li class="li"></li>
            <li class="li">
                <a href="#" class="botao" onclick="alert('Cartoons Section'); return false;">
                    <i class="fa-solid fa-tv"></i>
                    <span class="textomenu">Cartoons</span>
                </a>
            </li>
            <li class="li">
                <a href="#" class="botao" onclick="alert('Bookmark list'); return false;">
                    <i class="fa-solid fa-bookmark"></i>
                    <span class="textomenu">Saved</span>
                </a>
            </li>
        </ul>
    </div>

    <script>
        let searchTimer;
        let globalStreams = [];

        document.addEventListener('DOMContentLoaded', fetchStreamingAnime);

        function fetchStreamingAnime() {
            const container = document.getElementById('animeContainer');
            fetch('https://api.jikan.moe/v4/top/anime?limit=12')
                .then(res => res.json())
                .then(data => {
                    globalStreams = data.data || [];
                    renderStreamingGrid(globalStreams);
                })
                .catch(() => {
                    container.innerHTML = `<p style="padding: 20px; text-align: center; color: var(--text-sub);">Failed to load anime stream list.</p>`;
                });
        }

        function renderStreamingGrid(items) {
            const container = document.getElementById('animeContainer');
            container.innerHTML = '';

            items.forEach((anime, idx) => {
                const card = document.createElement('div');
                card.className = 'anime-card';
                card.onclick = () => openStreamPlayer(anime.title, anime.trailer?.embed_url || 'https://www.youtube.com/embed/dQw4w9WgXcQ');
                
                card.innerHTML = `
                    <div class="card-thumb-wrap">
                        <div class="post-ql"><span class="Qlty">HD • HINDI</span></div>
                        <img src="${anime.images.jpg.image_url}" class="card-thumb" alt="${anime.title}">
                        <div class="ep-badge">EP ${anime.episodes || '12'}</div>
                    </div>
                    <div class="card-details">
                        <div class="card-title">${anime.title}</div>
                        <div class="card-sub">Score: ${anime.score || 'N/A'} • ${anime.type || 'TV'}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Live Search Handler
        function liveSearch() {
            clearTimeout(searchTimer);
            const query = document.getElementById('searchInput').value.trim();
            const dropdown = document.getElementById('searchDropdown');

            if (query.length < 3) {
                dropdown.style.display = 'none';
                return;
            }

            searchTimer = setTimeout(() => {
                fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(query)}&limit=5`)
                    .then(res => res.json())
                    .then(data => {
                        dropdown.innerHTML = '';
                        if (!data.data || data.data.length === 0) {
                            dropdown.innerHTML = `<div class="search-item"><div class="search-name">No results found</div></div>`;
                        } else {
                            data.data.forEach(anime => {
                                const item = document.createElement('div');
                                item.className = 'search-item';
                                item.onclick = () => openStreamPlayer(anime.title, anime.trailer?.embed_url || 'https://www.youtube.com/embed/dQw4w9WgXcQ');
                                item.innerHTML = `
                                    <img src="${anime.images.jpg.image_url}" class="search-thumb">
                                    <div>
                                        <div class="search-name">${anime.title}</div>
                                        <div class="search-meta">Episodes: ${anime.episodes || 'N/A'}</div>
                                    </div>
                                `;
                                dropdown.appendChild(item);
                            });
                        }
                        dropdown.style.display = 'block';
                    })
                    .catch(() => {
                        dropdown.innerHTML = `<div class="search-item"><div class="search-name">Error fetching data</div></div>`;
                        dropdown.style.display = 'block';
                    });
            }, 300);
        }

        // Launch Stream Player
        function openStreamPlayer(title, videoUrl) {
            document.getElementById('pTitle').innerText = title;
            document.getElementById('pMainTitle').innerText = title;
            document.getElementById('videoPlayer').src = videoUrl + "?autoplay=1";
            document.getElementById('playerModal').style.display = 'block';
            document.getElementById('searchDropdown').style.display = 'none';
        }

        function closePlayer() {
            document.getElementById('playerModal').style.display = 'none';
            document.getElementById('videoPlayer').src = '';
        }

        function openRandomStream() {
            if (globalStreams.length > 0) {
                const random = globalStreams[Math.floor(Math.random() * globalStreams.length)];
                openStreamPlayer(random.title, random.trailer?.embed_url || 'https://www.youtube.com/embed/dQw4w9WgXcQ');
            }
        }
    </script>
</body>
</html>
