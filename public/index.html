  <style>
    /* ═══════════════════════════════════════
       DESIGN TOKENS
    ═══════════════════════════════════════ */
    :root {
      --bg-deep: #0a0a0f;
      --bg-base: #0f0f17;
      --bg-elevated: #161622;
      --bg-card: rgba(22, 22, 34, 0.7);
      --bg-card-hover: rgba(30, 30, 48, 0.85);

      --border: rgba(255, 255, 255, 0.06);
      --border-hover: rgba(139, 92, 246, 0.4);

      --accent: #8b5cf6;
      --accent-light: #a78bfa;
      --accent-glow: rgba(139, 92, 246, 0.15);
      --accent-pink: #ec4899;
      --accent-cyan: #06b6d4;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;

      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;

      --font-body: 'Space Grotesk', system-ui, sans-serif;
      --font-mono: 'Space Mono', 'Fira Code', monospace;

      --radius: 16px;
      --radius-sm: 10px;
      --radius-xs: 6px;

      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-spring: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* ═══════════════════════════════════════
       RESET & BASE
    ═══════════════════════════════════════ */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      background: var(--bg-deep);
      color: var(--text-primary);
      line-height: 1.7;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Noise texture overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
    }

    a { color: inherit; text-decoration: none; }
    code { font-family: var(--font-mono); font-size: 0.85em; }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ═══════════════════════════════════════
       AMBIENT BACKGROUND
    ═══════════════════════════════════════ */
    .ambient {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      overflow: hidden;
    }

    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.4;
      animation: float 20s ease-in-out infinite;
    }

    .ambient-orb:nth-child(1) {
      width: 600px; height: 600px;
      background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
      top: -200px; left: -100px;
      animation-delay: 0s;
    }

    .ambient-orb:nth-child(2) {
      width: 500px; height: 500px;
      background: radial-gradient(circle, var(--accent-pink) 0%, transparent 70%);
      bottom: -150px; right: -100px;
      animation-delay: -7s;
      animation-duration: 25s;
    }

    .ambient-orb:nth-child(3) {
      width: 400px; height: 400px;
      background: radial-gradient(circle, var(--accent-cyan) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -14s;
      animation-duration: 30s;
      opacity: 0.2;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(40px, -30px) scale(1.05); }
      66% { transform: translate(-20px, 20px) scale(0.95); }
    }

    /* ═══════════════════════════════════════
       HEADER / NAV
    ═══════════════════════════════════════ */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(10, 10, 15, 0.8);
      backdrop-filter: blur(20px) saturate(1.5);
      -webkit-backdrop-filter: blur(20px) saturate(1.5);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-mark {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-xs);
      background: linear-gradient(135deg, var(--accent), var(--accent-pink));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      position: relative;
      overflow: hidden;
    }

    .logo-mark::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.2));
    }

    .logo-text {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .logo-text span {
      background: linear-gradient(135deg, var(--accent-light), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    nav { display: flex; align-items: center; gap: 8px; }

    nav a {
      padding: 8px 16px;
      border-radius: var(--radius-xs);
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-secondary);
      transition: var(--transition);
      position: relative;
    }

    nav a:hover {
      color: var(--text-primary);
      background: var(--accent-glow);
    }

    nav a.nav-cta {
      background: var(--accent);
      color: white;
      font-weight: 600;
      padding: 8px 20px;
    }

    nav a.nav-cta:hover {
      background: var(--accent-light);
      transform: translateY(-1px);
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .mobile-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--text-primary);
      font-size: 1.4rem;
      cursor: pointer;
      padding: 8px;
    }

    /* ═══════════════════════════════════════
       HERO
    ═══════════════════════════════════════ */
    .hero {
      padding: 100px 0 80px;
      text-align: center;
      position: relative;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px 6px 8px;
      background: var(--accent-glow);
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 999px;
      font-size: 0.85rem;
      color: var(--accent-light);
      margin-bottom: 32px;
      animation: fadeInUp 0.8s ease-out;
    }

    .hero-badge .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent-emerald);
      box-shadow: 0 0 8px var(--accent-emerald);
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .hero h1 {
      font-size: clamp(2.8rem, 6vw, 4.5rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -2px;
      margin-bottom: 24px;
      animation: fadeInUp 0.8s ease-out 0.1s both;
    }

    .hero h1 .gradient {
      background: linear-gradient(135deg, var(--accent-light) 0%, var(--accent-pink) 50%, var(--accent-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-size: 200% auto;
      animation: shimmer 4s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%, 100% { background-position: 0% center; }
      50% { background-position: 100% center; }
    }

    .hero-sub {
      font-size: 1.2rem;
      color: var(--text-secondary);
      max-width: 640px;
      margin: 0 auto 40px;
      line-height: 1.8;
      animation: fadeInUp 0.8s ease-out 0.2s both;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      animation: fadeInUp 0.8s ease-out 0.3s both;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      border: none;
      position: relative;
      overflow: hidden;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-pink));
      color: white;
      box-shadow: 0 4px 24px rgba(139, 92, 246, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(139, 92, 246, 0.45);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover {
      color: var(--text-primary);
      border-color: var(--border-hover);
      background: var(--accent-glow);
    }

    /* Live preview strip */
    .hero-preview {
      margin-top: 64px;
      animation: fadeInUp 0.8s ease-out 0.4s both;
    }

    .terminal {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      text-align: left;
      max-width: 720px;
      margin: 0 auto;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.4);
    }

    .terminal-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 18px;
      background: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid var(--border);
    }

    .terminal-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
    }

    .terminal-dot.r { background: #ff5f57; }
    .terminal-dot.y { background: #febc2e; }
    .terminal-dot.g { background: #28c840; }

    .terminal-title {
      margin-left: 12px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .terminal-body {
      padding: 20px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      line-height: 1.8;
    }

    .terminal-body .prompt { color: var(--accent-emerald); }
    .terminal-body .cmd { color: var(--text-primary); }
    .terminal-body .url { color: var(--accent-light); }
    .terminal-body .comment { color: var(--text-muted); }
    .terminal-body .json-key { color: var(--accent-cyan); }
    .terminal-body .json-str { color: var(--accent-amber); }
    .terminal-body .json-num { color: var(--accent-emerald); }
    .terminal-body .bracket { color: var(--text-muted); }

    .cursor-blink {
      display: inline-block;
      width: 8px;
      height: 18px;
      background: var(--accent);
      animation: blink 1s step-end infinite;
      vertical-align: text-bottom;
      margin-left: 2px;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* ═══════════════════════════════════════
       STATS RIBBON
    ═══════════════════════════════════════ */
    .stats-ribbon {
      padding: 60px 0;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .stat-cell {
      background: var(--bg-base);
      padding: 32px 24px;
      text-align: center;
      transition: var(--transition);
    }

    .stat-cell:hover {
      background: var(--bg-elevated);
    }

    .stat-number {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 4px;
    }

    .stat-number.violet { color: var(--accent-light); }
    .stat-number.pink { color: var(--accent-pink); }
    .stat-number.cyan { color: var(--accent-cyan); }
    .stat-number.emerald { color: var(--accent-emerald); }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 500;
    }

    /* ═══════════════════════════════════════
       FEATURES
    ═══════════════════════════════════════ */
    .features {
      padding: 80px 0 60px;
    }

    .section-header {
      text-align: center;
      margin-bottom: 56px;
    }

    .section-label {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--accent-light);
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 16px;
      padding: 6px 14px;
      background: var(--accent-glow);
      border-radius: 999px;
      border: 1px solid rgba(139, 92, 246, 0.15);
    }

    .section-header h2 {
      font-size: clamp(2rem, 4vw, 2.8rem);
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 16px;
    }

    .section-header p {
      font-size: 1.1rem;
      color: var(--text-secondary);
      max-width: 560px;
      margin: 0 auto;
    }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1px;
      background: var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .feature-card {
      background: var(--bg-base);
      padding: 36px 28px;
      transition: var(--transition);
      position: relative;
    }

    .feature-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent-pink));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform var(--transition);
    }

    .feature-card:hover {
      background: var(--bg-elevated);
    }

    .feature-card:hover::before {
      transform: scaleX(1);
    }

    .feature-icon {
      width: 48px; height: 48px;
      border-radius: var(--radius-xs);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      margin-bottom: 20px;
      position: relative;
    }

    .fi-violet { background: rgba(139, 92, 246, 0.12); color: var(--accent-light); }
    .fi-pink { background: rgba(236, 72, 153, 0.12); color: var(--accent-pink); }
    .fi-cyan { background: rgba(6, 182, 212, 0.12); color: var(--accent-cyan); }
    .fi-emerald { background: rgba(16, 185, 129, 0.12); color: var(--accent-emerald); }
    .fi-amber { background: rgba(245, 158, 11, 0.12); color: var(--accent-amber); }
    .fi-rose { background: rgba(244, 63, 94, 0.12); color: var(--accent-rose); }

    .feature-card h3 {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 10px;
      letter-spacing: -0.3px;
    }

    .feature-card p {
      font-size: 0.95rem;
      color: var(--text-secondary);
      line-height: 1.7;
    }

    .feature-card code {
      background: rgba(139, 92, 246, 0.1);
      color: var(--accent-light);
