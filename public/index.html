<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchAnimeWorld Clone - NetQubo</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-body: #05060b;
            --bg-card: #0d0f17;
            --bg-nav: #080a10;
            --border: #181c28;
            --primary: #00d2d3;
            --text-main: #ffffff;
            --text-sub: #a0a5b5;
            --font-main: 'Poppins', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-main);
            background: var(--bg-body);
            color: var(--text-main);
            padding-bottom: 75px;
            overflow-x: hidden;
        }

        .container { max-width: 600px; margin: 0 auto; padding: 0 12px; }

        /* Telegram Floating Banner */
        .telegram-banner {
            background: linear-gradient(135deg, #0e1c2e, #142842);
            border: 1px solid #1d3b63;
            border-radius: 20px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 12px auto;
            max-width: 340px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .tg-info { display: flex; align-items: center; gap: 10px; }
        .tg-icon {
            background: #229ed9; color: #fff; width: 32px; height: 32px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }
        .tg-text h4 { font-size: 11px; font-weight: 700; }
        .tg-text p { font-size: 9px; color: #a0b2c6; }

        /* Search Bar */
        .search-box { position: relative; margin: 10px 0; }
        .search-input {
            width: 100%; background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px; padding: 10px 45px 10px 20px;
            color: #fff; font-size: 14px; outline: none;
        }
        .search-btn { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #fff; background: none; border: none; }

        /* Section Title Header */
        .section-header { font-size: 18px; font-weight: 800; margin: 20px 0 10px 0; }

        /* Horizontal Scroll Container */
        .scroll-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
        .scroll-row::-webkit-scrollbar { display: none; }

        /* Poster Cards */
        .post-card { min-width: 110px; width: 110px; background: var(--bg-card); border-radius: 8px; overflow: hidden; flex-shrink: 0; cursor: pointer; }
        .post-thumb { height: 145px; position: relative; background: #202433; }
        .post-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .badge-season { position: absolute; top: 5px; left: 5px; background: rgba(0,0,0,0.6); color: #fff; font-size: 8px; padding: 2px 6px; border-radius: 4px; }
        .badge-ep { position: absolute; bottom: 5px; left: 5px; background: rgba(0,0,0,0.7); color: #fff; font-size: 8px; padding: 2px 6px; border-radius: 4px; font-weight: 700; }
        .post-title { font-size: 11px; font-weight: 600; padding: 6px 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #d0d5e2; }

        /* Streaming View Box Modal */
        .stream-view {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-body); z-index: 500; overflow-y: auto; padding-bottom: 80px;
        }
        .player-box { width: 100%; aspect-ratio: 16/9; background: #000; }
        .player-box iframe { width: 100%; height: 100%; border: none; }

        .loader {
            display: none; color: var(--primary); text-align: center; padding: 20px; font-weight: bold;
        }

        /* Bottom Fixed Navigation Bar */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; background: #04050a;
            border-top: 1px solid #121624; display: flex; justify-content: space-around;
            align-items: center; padding: 6px 0; z-index: 1000;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; color: #5a627a; text-decoration: none; font-size: 8px; font-weight: 700; }
        .nav-item.active { color: var(--primary); }
        .nav-center-logo { width: 42px; height: 42px; background: #080b14; border: 2px solid var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--primary); font-weight: 900; font-size: 14px; margin-top: -15px; }
    </style>
</head>
<body>

    <div id="homeScreen" class="container">
        <!-- Telegram Banner -->
        <div class="telegram-banner" id="tgBanner">
            <div class="tg-info">
                <div class="tg-icon"><i class="fa-paper-plane"></i></div>
                <div class="tg-text">
                    <h4>Join our Telegram Group</h4>
                    <p>Stay updated - no spam!</p>
                </div>
            </div>
            <i class="fa-solid fa-xmark" onclick="document.getElementById('tgBanner').style.display='none'"></i>
        </div>

        <!-- Search Bar -->
        <div class="search-box">
            <input type="text" class="search-input" placeholder="Search">
            <button class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>

        <!-- Episodes List Section -->
        <h3 class="section-header">Newest Drops</h3>
        <div class="scroll-row">
            
            <!-- Episode 1 Card -->
            <div class="post-card" onclick="playEpisode('https://watchanimeworld.one/episode/arifureta-from-commonplace-to-worlds-strongest-3x1/')">
                <div class="post-thumb">
                    <span class="badge-season">Season 3</span>
                    <img src="https://cdn.myanimelist.net/images/anime/1162/141384.jpg" alt="Anime">
                    <span class="badge-ep">EP 1</span>
                </div>
                <div class="post-title">Arifureta S3 EP 1</div>
            </div>

            <!-- Episode 2 Card -->
            <div class="post-card" onclick="playEpisode('https://watchanimeworld.one/episode/arifureta-from-commonplace-to-worlds-strongest-3x2/')">
                <div class="post-thumb">
                    <span class="badge-season">Season 3</span>
                    <img src="https://cdn.myanimelist.net/images/anime/1162/141384.jpg" alt="Anime">
                    <span class="badge-ep">EP 2</span>
                </div>
                <div class="post-title">Arifureta S3 EP 2</div>
            </div>

        </div>
    </div>

    <!-- Video Player Screen -->
    <div id="streamScreen" class="stream-view">
        <div style="padding: 10px 12px; display: flex; justify-content: space-between; align-items: center;">
            <button onclick="closePlayer()" style="background:none; border:none; color:#fff; font-size:16px; cursor:pointer;">
                <i class="fa-solid fa-arrow-left"></i> Back
            </button>
            <span style="font-size: 11px; color: var(--text-sub);">Playing via Render Backend</span>
        </div>

        <div id="loadingText" class="loader">Extracting Stream... Please wait...</div>

        <div class="player-box">
            <!-- Iframe player with referrerpolicy fix -->
            <iframe id="vidIframe" src="" allowfullscreen referrerpolicy="no-referrer"></iframe>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <a href="#" class="nav-item"><i class="fa-solid fa-film"></i><span>MOVIES</span></a>
        <a href="#" class="nav-item"><i class="fa-solid fa-layer-group"></i><span>SERIES</span></a>
        <a href="#" class="nav-center-logo" onclick="closePlayer(); return false;">AW</a>
        <a href="#" class="nav-item active"><i class="fa-solid fa-user-ninja"></i><span>ANIME</span></a>
        <a href="#" class="nav-item"><i class="fa-solid fa-hat-wizard"></i><span>CARTOON</span></a>
    </div>

    <script>
        // Directly using your deployed Render backend API
        const BACKEND_URL = "https://anime-backend-47cq.onrender.com";

        async function playEpisode(targetUrl) {
            const streamScreen = document.getElementById('streamScreen');
            const iframe = document.getElementById('vidIframe');
            const loader = document.getElementById('loadingText');

            streamScreen.style.display = 'block';
            loader.style.display = 'block';
            iframe.src = ""; // Reset iframe

            try {
                // Fetch direct iframe embed from Render backend
                const response = await fetch(`${BACKEND_URL}/api/scrape?url=${encodeURIComponent(targetUrl)}`);
                const data = await response.json();

                if (data.success && data.embedUrl) {
                    iframe.src = data.embedUrl;
                } else {
                    alert("Stream source extract nahi ho saka!");
                }
            } catch (err) {
                alert("Backend Connection Fail! Check Render Service.");
                console.error(err);
            } finally {
                loader.style.display = 'none';
            }
        }

        function closePlayer() {
            document.getElementById('streamScreen').style.display = 'none';
            document.getElementById('vidIframe').src = "";
        }
    </script>
</body>
</html>
