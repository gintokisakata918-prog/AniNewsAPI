<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NetQubo | Anime Stats</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f7f9fc;
  color:#111827;
}

/* HEADER */

header{
  height:68px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;

  display:flex;
  align-items:center;

  padding:0 22px;

  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:27px;
  font-weight:800;
}

.logo span{
  color:#2189df;
}


/* MAIN */

.container{
  max-width:1100px;
  margin:auto;
  padding:28px 16px 60px;
}

.page-title{
  text-align:center;
  font-size:40px;
  margin:18px 0 28px;
}


/* SEARCH */

.search-box{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.search-box input{
  flex:1;

  height:58px;

  border:2px solid #d1d5db;
  border-radius:16px;

  padding:0 18px;

  font-size:18px;

  outline:none;

  background:#fff;
}

.search-box input:focus{
  border-color:#2189df;
}

.search-box button{
  width:64px;

  border:0;
  border-radius:15px;

  background:#2189df;

  color:white;

  font-size:28px;

  cursor:pointer;
}


/* STATUS */

.status{
  text-align:center;

  padding:12px;

  color:#6b7280;

  display:none;
}

.error{
  background:#fee2e2;
  color:#991b1b;

  padding:14px;

  border-radius:12px;

  margin-bottom:18px;

  display:none;
}


/* SEARCH RESULTS */

.results{
  display:grid;
  gap:10px;

  margin-bottom:25px;
}

.result{
  display:flex;

  gap:14px;

  padding:12px;

  background:#fff;

  border:1px solid #e5e7eb;

  border-radius:13px;

  cursor:pointer;
}

.result:hover{
  border-color:#2189df;
}

.result img{
  width:60px;
  height:80px;

  object-fit:cover;

  border-radius:8px;
}

.result h3{
  font-size:16px;
  margin:4px 0 7px;
}

.result p{
  color:#6b7280;
  font-size:13px;
}


/* EXPLORE */

.explore-title{
  font-size:28px;
  margin:25px 0 15px;
}


/* TOP GRID */

.top-grid{
  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:14px;

  margin-bottom:30px;
}

.top-card{
  background:white;

  border:1px solid #e5e7eb;

  border-radius:15px;

  overflow:hidden;

  cursor:pointer;

  transition:.2s;
}

.top-card:hover{
  transform:translateY(-3px);
  box-shadow:0 5px 18px rgba(0,0,0,.08);
}

.top-card img{
  width:100%;

  aspect-ratio:2/3;

  object-fit:cover;
}

.top-info{
  padding:11px;
}

.top-info h3{
  font-size:15px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.top-info p{
  margin-top:7px;

  color:#f59e0b;

  font-weight:bold;
}


/* ANIME */

.anime-section{
  display:none;
}

.anime-card{
  background:#fff;

  border:1px solid #e5e7eb;

  border-radius:18px;

  padding:20px;

  display:flex;

  gap:24px;

  box-shadow:0 3px 15px rgba(0,0,0,.04);
}

.poster{
  width:190px;
  height:270px;

  object-fit:cover;

  border-radius:12px;
}

.info{
  flex:1;
}

.rating{
  font-size:25px;

  font-weight:bold;
}

.rating-star{
  color:#f59e0b;
}

.votes{
  color:#6b7280;

  font-size:14px;

  margin-left:6px;
}

.info h2{
  font-size:28px;

  margin:15px 0 7px;
}

.japanese{
  color:#6b7280;

  line-height:1.5;
}

.stats{
  display:flex;

  gap:30px;

  margin-top:23px;

  flex-wrap:wrap;
}

.stat b{
  display:block;

  font-size:21px;
}

.stat span{
  color:#6b7280;

  font-size:13px;
}


/* TABS */

.tabs{
  margin-top:20px;

  display:flex;

  gap:8px;

  flex-wrap:wrap;
}

.tab{
  background:white;

  border:1px solid #d1d5db;

  padding:11px 20px;

  border-radius:12px;

  font-size:15px;

  cursor:pointer;
}

.tab.active{
  color:#2189df;

  border-color:#2189df;

  font-weight:bold;
}


/* EPISODES */

.episodes{
  margin-top:18px;

  display:grid;

  grid-template-columns:
    repeat(5,1fr);

  gap:10px;
}

.ep{
  border-radius:13px;

  padding:13px;

  min-height:88px;

  border:0;

  text-align:left;
}

.ep-number{
  font-size:14px;

  opacity:.75;
}

.ep-score{
  font-size:27px;

  font-weight:bold;

  margin-top:7px;
}

.great{
  background:#16804b;
  color:white;
}

.good{
  background:#20c568;
  color:white;
}

.average{
  background:#facc15;
  color:#111;
}

.low{
  background:#ef4444;
  color:white;
}

.no-score{
  background:#e5e7eb;
  color:#6b7280;
}


/* GRAPH */

.graph-box{
  background:white;

  border:1px solid #e5e7eb;

  border-radius:15px;

  padding:15px;

  margin-top:18px;

  display:none;
}

canvas{
  width:100%;
  height:330px;
}


/* TABLE */

.table-wrap{
  margin-top:18px;

  background:white;

  border:1px solid #e5e7eb;

  border-radius:15px;

  overflow:auto;

  display:none;
}

table{
  width:100%;

  border-collapse:collapse;
}

th,td{
  padding:14px;

  text-align:left;

  border-bottom:1px solid #eee;
}

th{
  background:#f8fafc;
}


/* MOBILE */

@media(max-width:700px){

  .page-title{
    font-size:31px;
  }

  .top-grid{
    grid-template-columns:
      repeat(2,1fr);
  }

  .anime-card{
    flex-direction:column;
  }

  .poster{
    width:145px;
    height:210px;
  }

  .info h2{
    font-size:23px;
  }

  .episodes{
    grid-template-columns:
      repeat(2,1fr);
  }

}

</style>
</head>

<script>


/* ======================================
   API
====================================== */

const API =
  "https://api.jikan.moe/v4";


/* ======================================
   HELPERS
====================================== */

const sleep =
  ms =>
    new Promise(
      resolve =>
        setTimeout(resolve,ms)
    );


function showStatus(text){

  const el =
    document.getElementById("status");

  el.textContent =
    text;

  el.style.display =
    text ? "block" : "none";

}


function showError(text){

  const el =
    document.getElementById("error");

  el.textContent =
    text;

  el.style.display =
    text ? "block" : "none";

}


function formatNumber(num){

  if(!num)
    return "0";

  return new Intl.NumberFormat(
    "en-US",
    {
      notation:"compact",
      maximumFractionDigits:1
    }
  ).format(num);

}


/* ======================================
   SAFE FETCH
====================================== */

async function apiFetch(url){

  let lastError = null;

  for(let attempt=0;attempt<3;attempt++){

    try{

      const response =
        await fetch(url);

      if(response.status === 429){

        await sleep(
          1200 * (attempt + 1)
        );

        continue;
      }

      if(!response.ok){

        throw new Error(
          "HTTP " + response.status
        );

      }

      return await response.json();

    }catch(error){

      lastError = error;

      await sleep(
        700 * (attempt + 1)
      );

    }

  }

  throw lastError ||
    new Error("API request failed");

}


/* ======================================
   SEARCH
====================================== */

async function searchAnime(){

  const query =
    document
      .getElementById("searchInput")
      .value
      .trim();


  if(!query){

    showError(
      "Please enter an anime name."
    );

    return;

  }


  showError("");

  showStatus(
    "Searching MyAnimeList..."
  );


  const results =
    document.getElementById("results");

  results.innerHTML = "";


  try{

    const data =
      await apiFetch(

        API +
        "/anime?q=" +
        encodeURIComponent(query) +
        "&limit=10"

      );


    showStatus("");


    if(
      !data.data ||
      !data.data.length
    ){

      results.innerHTML =
        "<div class='status' style='display:block'>Anime not found.</div>";

      return;

    }


    data.data.forEach(
      anime =>
        addSearchResult(
          anime
        )
    );


  }catch(error){

    showStatus("");

    showError(
      "Search failed. Jikan API may be temporarily rate-limited. Please try again in a few seconds."
    );

  }

}


/* ======================================
   SEARCH RESULT CARD
====================================== */

function addSearchResult(anime){

  const results =
    document.getElementById("results");


  const item =
    document.createElement("div");


  item.className =
    "result";


  const image =
    anime.images?.jpg?.image_url ||
    "";


  item.innerHTML = `

    <img
      src="${image}"
      alt=""
    >

    <div>

      <h3>
        ${escapeHTML(anime.title)}
      </h3>

      <p>
        ★ ${anime.score || "N/A"}
        •
        ${anime.type || "Unknown"}
        •
        ${anime.year || ""}
      </p>

    </div>

  `;


  item.onclick =
    () =>
      loadAnime(
        anime.mal_id
      );


  results.appendChild(item);

}


/* ======================================
   LOAD ANIME
====================================== */

async function loadAnime(id){

  showError("");

  showStatus(
    "Loading anime information..."
  );


  const section =
    document.getElementById(
      "animeSection"
    );


  section.style.display =
    "none";


  try{

    const result =
      await apiFetch(
        API +
        "/anime/" +
        id
      );


    const anime =
      result.data;


    document.getElementById(
      "poster"
    ).src =
      anime.images?.jpg?.large_image_url ||
      anime.images?.jpg?.image_url ||
      "";


    document.getElementById(
      "title"
    ).textContent =
      anime.title || "Unknown";


    document.getElementById(
      "japanese"
    ).textContent =
      anime.title_japanese || "";


    document.getElementById(
      "rating"
    ).textContent =
      anime.score || "N/A";


    document.getElementById(
      "votes"
    ).textContent =
      anime.scored_by
      ? "(" +
        formatNumber(
          anime.scored_by
        ) +
        " votes)"
      : "";


    document.getElementById(
      "episodes"
    ).textContent =
      anime.episodes || "—";


    document.getElementById(
      "rank"
    ).textContent =
      anime.rank
      ? "#" + anime.rank
      : "—";


    document.getElementById(
      "members"
    ).textContent =
      formatNumber(
        anime.members
      );


    document.getElementById(
      "status"
    ).textContent =
      anime.status || "—";


    section.style.display =
      "block";


    document
      .getElementById("results")
      .innerHTML = "";


    document
      .getElementById("exploreSection")
      .style.display = "none";


    showStatus(
      "Loading episode ratings..."
    );


    /*
     * Small delay to avoid
     * hitting Jikan too quickly.
     */

    await sleep(500);


    await loadEpisodes(id);


    showStatus("");


    section.scrollIntoView({
      behavior:"smooth"
    });


  }catch(error){

    showStatus("");

    showError(
      "Unable to load this anime. Please try again."
    );

  }

}


/* ======================================
   EPISODES
====================================== */

async function loadEpisodes(id){

  let allEpisodes = [];

  let page = 1;


  /*
   * Fetch first page.
   * Jikan paginates episode lists.
   */

  try{

    const first =
      await apiFetch(

        API +
        "/anime/" +
        id +
        "/episodes?page=1"

      );


    allEpisodes =
      first.data || [];


    /*
     * For anime with >100 episodes,
     * load another page.
     */

    if(
      first.pagination &&
      first.pagination.has_next_page
    ){

      await sleep(500);


      const second =
        await apiFetch(

          API +
          "/anime/" +
          id +
          "/episodes?page=2"

        );


      allEpisodes =
        allEpisodes.concat(
          second.data || []
        );

    }


  }catch(error){

    console.log(
      "Episode API error:",
      error
    );

  }


  renderEpisodes(
    allEpisodes
  );

}


/* ======================================
   RENDER EPISODES
====================================== */

function renderEpisodes(episodes){

  const cards =
    document.getElementById(
      "cardsView"
    );


  const table =
    document.getElementById(
      "episodeTable"
    );


  cards.innerHTML = "";

  table.innerHTML = "";


  if(!episodes.length){

    cards.innerHTML = `

      <div
        class="status"
        style="display:block;grid-column:1/-1">

        Episode ratings are not available
        for this anime.

      </div>

    `;

    return;

  }


  episodes.forEach(ep => {

    const score =
      ep.score;


    /*
     * Episode number
     */

    const number =
      ep.mal_id ||
      ep.mal_id === 0
      ? ep.mal_id
      : ep.episode;


    /* CARD */

    const card =
      document.createElement("div");


    card.className =
      "ep " +
      getScoreClass(score);


    card.innerHTML = `

      <div class="ep-number">
        E${number}
      </div>

      <div class="ep-score">
        ${score || "N/A"}
      </div>

    `;


    cards.appendChild(card);


    /* TABLE */

    const row =
      document.createElement("tr");


    row.innerHTML = `

      <td>
        E${number}
      </td>

      <td>
        ${escapeHTML(
          ep.title ||
          "Episode " + number
        )}
      </td>

      <td>
        ${score || "N/A"}
      </td>

    `;


    table.appendChild(row);

  });


  drawGraph(
    episodes
  );

}


/* ======================================
   SCORE COLOR
====================================== */

function getScoreClass(score){

  if(!score)
    return "no-score";

  if(score >= 9)
    return "great";

  if(score >= 8)
    return "good";

  if(score >= 7)
    return "average";

  return "low";

}


/* ======================================
   GRAPH
====================================== */

function drawGraph(episodes){

  const canvas =
    document.getElementById(
      "chart"
    );


  const ctx =
    canvas.getContext("2d");


  const width =
    canvas.clientWidth || 600;


  const height =
    canvas.clientHeight || 330;


  const ratio =
    window.devicePixelRatio || 1;


  canvas.width =
    width * ratio;


  canvas.height =
    height * ratio;


  ctx.scale(
    ratio,
    ratio
  );


  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  const valid =
    episodes.filter(
      ep =>
        typeof ep.score ===
        "number"
    );


  if(!valid.length){

    ctx.fillStyle =
      "#6b7280";

    ctx.font =
      "16px Arial";

    ctx.fillText(
      "Episode scores unavailable",
      20,
      40
    );

    return;

  }


  const padding = 40;

  const chartWidth =
    width -
    padding * 2;

  const chartHeight =
    height -
    padding * 2;


  /* GRID */

  ctx.strokeStyle =
    "#e5e7eb";

  ctx.lineWidth = 1;


  for(
    let i=0;
    i<=5;
    i++
  ){

    const y =
      padding +
      chartHeight -
      (i/5) *
      chartHeight;


    ctx.beginPath();

    ctx.moveTo(
      padding,
      y
    );

    ctx.lineTo(
      width-padding,
      y
    );

    ctx.stroke();


    ctx.fillStyle =
      "#6b7280";

    ctx.font =
      "11px Arial";


    ctx.fillText(
      String(5+i),
      10,
      y+4
    );

  }


  /* LINE */

  ctx.beginPath();


  valid.forEach(
    (ep,index) => {

      const x =
        padding +
        (index /
        Math.max(
          valid.length-1,
          1
        )) *
        chartWidth;


      const y =
        padding +
        chartHeight -
        ((ep.score-5)/5) *
        chartHeight;


      if(index === 0)
        ctx.moveTo(x,y);
      else
        ctx.lineTo(x,y);

    }
  );


  ctx.strokeStyle =
    "#2189df";

  ctx.lineWidth = 3;

  ctx.stroke();


  /* POINTS */

  valid.forEach(
    (ep,index) => {

      const x =
        padding +
        (index /
        Math.max(
          valid.length-1,
          1
        )) *
        chartWidth;


      const y =
        padding +
        chartHeight -
        ((ep.score-5)/5) *
        chartHeight;


      ctx.beginPath();


      ctx.arc(
        x,
        y,
        4,
        0,
        Math.PI*2
      );


      ctx.fillStyle =
        "#2189df";

      ctx.fill();

    }
  );

}


/* ======================================
   VIEW SWITCH
====================================== */

function showView(
  view,
  button
){

  document
    .querySelectorAll(".tab")
    .forEach(
      b =>
        b.classList.remove(
          "active"
        )
    );


  button.classList.add(
    "active"
  );


  document.getElementById(
    "cardsView"
  ).style.display =
    view === "cards"
    ? "grid"
    : "none";


  document.getElementById(
    "graphView"
  ).style.display =
    view === "graph"
    ? "block"
    : "none";


  document.getElementById(
    "tableView"
  ).style.display =
    view === "table"
    ? "block"
    : "none";


  if(view === "graph"){

    /*
     * Redraw after becoming visible.
     */

    const canvas =
      document.getElementById(
        "chart"
      );

    if(canvas)
      window.dispatchEvent(
        new Event("resize")
      );

  }

}


/* ======================================
   ESCAPE HTML
====================================== */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* ======================================
   ENTER SEARCH
====================================== */

document
  .getElementById("searchInput")
  .addEventListener(
    "keydown",
    event => {

      if(
        event.key === "Enter"
      ){

        searchAnime();

      }

    }
  );


/* ======================================
   INITIAL TOP ANIME
====================================== */

async function loadTopAnime(){

  showStatus(
    "Loading popular anime..."
  );


  try{

    const result =
      await apiFetch(
        API +
        "/top/anime?limit=8"
      );


    const grid =
      document.getElementB
